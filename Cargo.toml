[package]
name = "sphereview"
version = "0.1.6"
edition = "2024"
build = "build.rs"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_20", "blueprint"] }
glib = { version = "0.22.10", features = ["v2_84"] }
gio = { version = "0.22.10", features = ["v2_84"] }
libadwaita = { version = "0.9.2", features = ["v1_8"] }
webkit6 = "0.6.1"
base64 = "0.23.1"
log = "0.4.35"
env_logger = "0.11.11"
once_cell = "1.21.4"

[dev-dependencies]
toml = "1.2.1"
roxmltree = "0.21.2"
regex = "1.13.1"
